# @package _global_

defaults:
  - base
  - _self_

experiment:
  name: test_scheduler_resume

training:
  resume_from_checkpoint: true
  checkpoint_path: "./test_scheduler_checkpoints/latest.pt"
  additional_steps: 40  # Доучиваем еще 40 шагов (итого будет 60)
  checkpoint_interval: 15
  log_interval: 5
  eval_interval: 20
  checkpoint_dir: "./test_scheduler_checkpoints_resumed"
  batch_size: 4
  
model:
  d_model: 64  # Должно совпадать с исходной моделью
  num_layers: 2
  num_experts: 2

alpha_schedule:
  _target_: schedulers.LinearScheduler
  use_warmup: false
  warmup_steps: 0
  initial_value: 1.0
  final_value: 0.1  # Должно достичь 0.1 в итоге 