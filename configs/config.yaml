experiment:
  name: "moe_wikitext"

model:
  d_model: 256
  num_layers: 3
  num_experts: 4
  top_k: 2
  padding_idx: 0

training:
  dataset_name: "wikitext-2-v1"
  batch_size: 32
  seq_len: 256
  num_workers: 2
  epochs: 3
  lr: 3e-4
  log_interval: 50
  total_steps: 100000
  gpu_id: 0 # default id

alpha_schedule:
  _target_: "schedulers.ConstantScheduler"
  use_warmup: true
  warmup_steps: 1000
  initial_value: 0.01
  final_value: 0.01


mlflow:
  tracking_uri: "file:./mlruns"
  experiment_name: "wikitext103_moe"
